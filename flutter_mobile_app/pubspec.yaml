name: rakhoh_telematics_mobile
description: "Rakhoh Industries Mobile Engineer Duty Dashboard & High-Frequency GPS Tracking App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Plugins
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  firebase_database: ^11.0.0
  cloud_firestore: ^5.0.0

  # High-Accuracy GPS Telematics
  geolocator: ^12.0.0

  # Excel Exporting & File Storage
  excel: ^4.0.3
  path_provider: ^2.1.3
  open_file: ^3.3.2

  # UI & Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/rakhoh-logo.svg
