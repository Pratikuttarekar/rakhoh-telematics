<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="450" height="100">
  <defs>
    <!-- Gradient for Flame / Gear Emblem -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Gradient for Text / Metallic Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Emblem Icon: Boiler Gear & Thermal Flame -->
  <g transform="translate(10, 10)">
    <!-- Outer Gear Circle -->
    <circle cx="40" cy="40" r="36" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-dasharray="14 6"/>
    <!-- Inner Flame Core -->
    <path d="M40 12 C45 25 56 32 56 46 C56 56 48 64 38 64 C28 64 22 56 22 46 C22 36 30 26 34 22 C34 32 40 36 40 36 C40 36 42 22 40 12 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
    <!-- Heat Rays -->
    <circle cx="40" cy="40" r="8" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Corporate Typography -->
  <!-- RAKHOH Title -->
  <text x="100" y="52" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="42" fill="#f8fafc" letter-spacing="2">
    RAKHOH
  </text>
  
  <!-- Subtitle Line -->
  <text x="102" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#38bdf8" letter-spacing="1.5">
    INDUSTRIES PVT. LTD.
  </text>

  <!-- Line Accent -->
  <line x1="100" y1="82" x2="430" y2="82" stroke="url(#flameGrad)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
